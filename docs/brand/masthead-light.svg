<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="tsundoku, the pile that keeps growing, catalogued">
  <!--
    THE MASTHEAD, on the light ground. Generated from one geometry and checked by
    `src/components/mark.test.ts`, which reads this file, parses these rectangles and holds
    them to `PILE` in `src/components/mark.tsx`, the same wall that keeps the favicon from
    drifting into a second logo. Three drawings of one pile, and none of them is the
    original.

    Two files rather than one with a media query, because this is loaded through an `<img>`
    in a README and the picking is done by `<picture>` there. Each one therefore states its
    own ground and its own colours: the paper, and the three bindings the pile is drawn in
    (cloth, gilt and ink, ADR-0026), converted from `src/app/globals.css` to sRGB. They are
    the values `src/app/outside-the-cascade.ts` names for the surfaces the stylesheet cannot
    reach, and the same wall pins both.

    Nothing here names a fifth colour. What is quieter is ink at an opacity, which is why a
    palette change cannot leave a stale hex behind in a picture nobody re-reads.

    The face is the application's own serif, named first and then fallen back through: a
    README is read on somebody else's machine and there is no `next/font` out here to serve it.
  -->
  <rect class="ground" width="960" height="300" fill="#f2f0ea"/>

  <g transform="translate(56 54) scale(6)">
    <rect class="spine cloth" x="5" y="6" width="20" height="5.5" rx="1.2" fill="#2f3f7a"/>
    <rect class="spine gilt" x="3" y="13.5" width="24" height="5.5" rx="1.2" fill="#a77b22"/>
    <rect class="spine ink" x="6" y="21" width="22" height="5.5" rx="1.2" fill="#232836"/>
  </g>

  <g fill="#232836" font-family="Newsreader, 'Iowan Old Style', Georgia, 'Times New Roman', serif">
    <text x="268" y="168" font-size="116" font-weight="600" letter-spacing="-1.5">tsundoku</text>
    <text x="272" y="226" opacity="0.66" font-size="30" font-style="italic">the pile that keeps growing, catalogued</text>
  </g>
</svg>
