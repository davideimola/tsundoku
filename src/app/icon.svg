<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    THE MARK, AS A TAB PUTS IT.

    The same pile `src/components/mark.tsx` draws, and `src/components/mark.test.ts` is what
    keeps the two from drifting: it reads this file, parses these rectangles and compares
    them to the geometry the chrome renders. Edit one and the other fails.

    Two things this file has that the component does not, both for the same reason: a tab
    is outside this application's cascade.

      1. It states its colours itself. The three bindings are cloth, gilt and ink from
         `src/app/globals.css`, converted to sRGB because a favicon is the one surface where
         the tokens cannot be reached, and `src/app/palette.test.ts` pins them there.
      2. It states both grounds, in the order cloth, gilt, ink on each.

    Transparent behind, so the mark sits on the tab's own ground rather than on a card of
    its own.
  -->
  <style>
    .cloth { fill: #2f3f7a; }
    .gilt { fill: #a77b22; }
    .ink { fill: #232836; }
    @media (prefers-color-scheme: dark) {
      .cloth { fill: #3d4f98; }
      .gilt { fill: #d9b062; }
      .ink { fill: #e9e6de; }
    }
  </style>
  <rect class="cloth" x="5" y="6" width="20" height="5.5" rx="1.2"/>
  <rect class="gilt" x="3" y="13.5" width="24" height="5.5" rx="1.2"/>
  <rect class="ink" x="6" y="21" width="22" height="5.5" rx="1.2"/>
</svg>
