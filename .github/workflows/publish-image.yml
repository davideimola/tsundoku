# The other half of Flux's image automation: the Cluster watches this registry and writes
# the newest tag back into `davideimola/cluster`, so a push to main is the deploy and
# nothing in either repository is edited by hand.
#
# **`davideimola/cluster`, not `davideimola/home-cluster`.** tsundoku was written to run on the
# house machine and moved before it ever reconciled there: it is the one service published to
# the internet, which is what the cloud Cluster exists for and what the house deliberately is
# not (infrastructure ADR-0006).
#
# Shaped exactly like pantry's workflow, because the automation on the other side is
# pantry's automation with a different name and reads the same tag shape.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main-<sha>-<unix timestamp>: the sha says which commit, the timestamp sorts.
          # Sorting is the point — image tags carry no inherent order, and Flux's automation
          # needs to know which of two builds is newer. `main` stays as a human-readable
          # pointer, and is what the manifests name before automation has run once.
          tags: |
            type=raw,value=main
            type=raw,value=main-{{sha}}-{{date 'X'}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The Node this deploys to is x86: Contabo's VPS line is, and infrastructure
          # ADR-0008 says so outright — "arm64 is no longer a constraint", because the Cluster
          # was only ever aarch64 as a consequence of Oracle's A1 being Ampere.
          #
          # It was `linux/amd64,linux/arm64` for a day, from when the target was the house
          # machine, which is arm64. The arm64 leg has to be emulated with QEMU on a GitHub
          # runner (native arm64 runners are a paid-plan feature on a private repository) and
          # was the slow half of this job by a wide margin — so once it stopped being deployed
          # anywhere it stopped being worth building. `docker/setup-qemu-action` went with it;
          # it was only ever there to register the binfmt handlers that leg needed.
          #
          # If a developer's arm64 laptop ever needs to run this image rather than the source,
          # add the leg back rather than reaching for `--platform` and emulating at run time.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build arguments, and no `DATABASE_URL`. The Dockerfile says why at length.
          cache-from: type=gha
          cache-to: type=gha,mode=max
