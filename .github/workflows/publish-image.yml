# The other half of Flux's image automation: the cluster watches this registry and writes
# the newest tag back into `davideimola/home-cluster`, so a push to main is the deploy and
# nothing in either repository is edited by hand.
#
# Shaped exactly like pantry's workflow, because the automation on the other side is
# pantry's automation with a different name and reads the same tag shape.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # arm64 is built by emulation on an amd64 runner, so the binfmt handlers have to be
      # registered before buildx starts. Native arm64 runners are a paid-plan feature on a
      # private repository; QEMU is the option that works on any plan.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main-<sha>-<unix timestamp>: the sha says which commit, the timestamp sorts.
          # Sorting is the point — image tags carry no inherent order, and Flux's automation
          # needs to know which of two builds is newer. `main` stays as a human-readable
          # pointer, and is what the manifests name before automation has run once.
          tags: |
            type=raw,value=main
            type=raw,value=main-{{sha}}-{{date 'X'}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The cluster's node is arm64, and so is a developer's laptop; amd64 is published
          # alongside it so the image stays runnable anywhere rather than only where it
          # happens to be deployed today. Nothing in the image is architecture-specific
          # beyond the base image and the native binaries pnpm resolves per platform — the
          # lockfile carries the arm64-musl variants of swc, oxide and lightningcss, which
          # is what makes the arm64 leg build at all.
          #
          # The arm64 leg runs under emulation and is the slow half of this job by a wide
          # margin. That is the price of one runner; the gha cache keeps it off the path of
          # every push that does not touch the lockfile or the sources.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build arguments, and no `DATABASE_URL`. The Dockerfile says why at length.
          cache-from: type=gha
          cache-to: type=gha,mode=max
