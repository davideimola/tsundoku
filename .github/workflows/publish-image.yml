# The image, published to GHCR on every push to main.
#
# What it is for: the owner's deployment watches this registry and rolls itself forward to
# the newest tag, so a push to main is the deploy and nothing is edited by hand on the other
# side. The tag shape below is the whole contract — `main-<sha>-<timestamp>`, sortable, so
# "the newest" is a string comparison rather than a registry query.
#
# Nothing about where it runs is in this repository, and nothing here needs to be: the image
# is self-contained, it carries its own migrations, and `compose.yaml`
# is one way to run it that owes this workflow nothing.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main-<sha>-<unix timestamp>: the sha says which commit, the timestamp sorts.
          # Sorting is the point — image tags carry no inherent order, and the automation
          # needs to know which of two builds is newer. `main` stays as a human-readable
          # pointer, and is what the manifests name before automation has run once.
          tags: |
            type=raw,value=main
            type=raw,value=main-{{sha}}-{{date 'X'}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The Node this deploys to is x86: Contabo's VPS line is, and infrastructure
          # ADR-0008 says so outright — "arm64 is no longer a constraint", because the machine
          # was only ever aarch64 as a consequence of Oracle's A1 being Ampere.
          #
          # It was `linux/amd64,linux/arm64` for a day, from when the target was the house
          # machine, which is arm64. The arm64 leg has to be emulated with QEMU on a GitHub
          # runner (native arm64 runners are a paid-plan feature on a private repository) and
          # was the slow half of this job by a wide margin — so once it stopped being deployed
          # anywhere it stopped being worth building. `docker/setup-qemu-action` went with it;
          # it was only ever there to register the binfmt handlers that leg needed.
          #
          # If a developer's arm64 laptop ever needs to run this image rather than the source,
          # add the leg back rather than reaching for `--platform` and emulating at run time.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build arguments, and no `DATABASE_URL`. The Dockerfile says why at length.
          cache-from: type=gha
          cache-to: type=gha,mode=max
